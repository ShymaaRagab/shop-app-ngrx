<div class="login-container">
  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="submit()">
    
    <div class="form-group">
      <label>User Name</label>
      <input type="text" formControlName="username"/>

      <small *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
        <span *ngIf="loginForm.get('username')?.errors?.['required']">Username is required</span>
        <span *ngIf="loginForm.get('username')?.errors?.['minlength']">Minimum 3 characters</span>
      </small>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password"/>

      <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
        <span *ngIf="loginForm.get('password')?.errors?.['minlength']">
          Minimum 6 characters
        </span>
      </small>
    </div>

    <button type="submit">Login</button>
  </form>
</div>
